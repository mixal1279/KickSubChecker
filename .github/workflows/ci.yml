name: CI

on:
  push:
    branches:
      - main
      - feature/kicksubchecker-v2-backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sprawdź składnię
        run: npm run check
      - name: Uruchom testy
        run: npm test
